backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "cms: publicar noticia '{{slug}}'"
    update: "cms: actualizar noticia '{{slug}}'"
    delete: "cms: eliminar noticia '{{slug}}'"
publish_mode: simple
locale: es
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
media_folder: public/uploads
public_folder: /uploads
editor:
  preview: true
collections:
  - name: news
    label: Noticias
    label_singular: Noticia
    folder: src/content/news
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Título, name: title, widget: string, hint: "Titular de la noticia." }
      - { label: Bajada, name: summary, widget: text, required: false, hint: "Opcional. Contexto breve para la portada y la nota." }
      - { label: Fecha y hora de publicación, name: publishedAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD/MM/YYYY", time_format: "HH:mm", hint: "Se muestra en la web y alimenta Último momento." }
      - { label: Fecha y hora de actualización, name: updatedAt, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
      - { label: Sección principal, name: primarySection, widget: select, default: Actualidad, options: [Actualidad, Política, Deportes, Cultura], hint: "Define en qué carril y página de sección aparecerá la noticia." }
      - { label: Otras secciones, name: sections, widget: select, multiple: true, required: false, options: [Actualidad, Política, Deportes, Cultura], hint: "Una noticia puede aparecer en más de una sección." }
      - { label: Etiquetas, name: tags, widget: list, required: false, hint: "Opcional. Sirven para búsqueda y recomendaciones." }
      - { label: Imagen principal, name: image, widget: image, required: false, choose_url: true }
      - label: Encuadre en portada
        name: imagePosition
        widget: select
        required: false
        default: "50% 50%"
        hint: "Si la foto se recorta para llenar una tarjeta, elegí la zona que querés conservar. La foto original no se modifica."
        options:
          - { label: "Arriba a la izquierda", value: "0% 0%" }
          - { label: "Arriba al centro", value: "50% 0%" }
          - { label: "Arriba a la derecha", value: "100% 0%" }
          - { label: "Centro a la izquierda", value: "0% 50%" }
          - { label: "Centro (recomendado)", value: "50% 50%" }
          - { label: "Centro a la derecha", value: "100% 50%" }
          - { label: "Abajo a la izquierda", value: "0% 100%" }
          - { label: "Abajo al centro", value: "50% 100%" }
          - { label: "Abajo a la derecha", value: "100% 100%" }
      - { label: Crédito de imagen, name: imageCredit, widget: string, required: false }
      - label: Galería
        name: gallery
        widget: list
        required: false
        fields:
          - { label: Imagen, name: image, widget: image, choose_url: true }
          - { label: Epígrafe, name: caption, widget: string, required: false }
      - label: Videos
        name: videos
        widget: list
        required: false
        fields:
          - { label: Tipo, name: type, widget: select, options: [Archivo propio, YouTube, Instagram] }
          - { label: Enlace o archivo, name: url, widget: string, required: false, hint: "Pegá una URL de YouTube/Instagram o la ruta del archivo propio." }
          - { label: Descripción, name: caption, widget: string, required: false }
      - { label: Cuerpo de la noticia, name: body, widget: markdown, required: false, hint: "Opcional. Podés publicar una actualización breve, texto extenso o solo multimedia." }
  - name: homepage
    label: Portada
    label_singular: Organización de portada
    files:
      - name: portada
        label: Organización de portada
        file: src/content/home/portada.yml
        fields:
          - label: Noticia principal
            name: main
            widget: relation
            collection: news
            search_fields: [title]
            value_field: "{{slug}}"
            display_fields: [title]
            options_length: 100
            hint: "La única nota que se muestra como principal en la portada."
          - label: Noticia urgente
            name: urgent
            widget: relation
            required: false
            collection: news
            search_fields: [title]
            value_field: "{{slug}}"
            display_fields: [title]
            options_length: 100
            hint: "Opcional. Esta selección controla la tira URGENTE, independientemente de la nota principal."
          - label: Noticias destacadas
            name: featured
            widget: list
            required: false
            summary: "Destacada: {{fields.story}}"
            hint: "Agregá y reordená las notas. Las dos primeras se muestran junto a la noticia principal."
            fields:
              - label: Noticia
                name: story
                widget: relation
                collection: news
                search_fields: [title]
                value_field: "{{slug}}"
                display_fields: [title]
                options_length: 100
